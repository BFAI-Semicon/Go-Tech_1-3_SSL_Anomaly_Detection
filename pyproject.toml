[project]
name = "ssl-anomaly-detection"
version = "0.1.0"
description = "工程横断ゼロショット欠陥検出 (Promptable Patch Retrieval): SSL ViT(DINOv3) + FAISS 特徴量ストア + LLM 構造化"
readme = "docs/researches.md"
# 3.12 に固定。DGX Spark 向け torch cu130 aarch64 wheel が cp312 で提供され、
# anomalib(>=3.10) / timm / faiss-cpu / vLLM いずれも 3.12 対応。
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- 異常検知フレームワーク ---
    # DGX Spark は CUDA 13 / Blackwell(sm_121) なので cu130 extra を使用
    # (torch>=2.9 / torchvision>=0.24 / torchcodec>=0.9 を引き込む)。
    # DINOv3 は anomalib>=2.5.1 の TimmFeatureExtractor（output_fmt="NLC"）経由で利用。
    # 利用範囲は特徴抽出・データ読み込み(anomalib.data)・評価メトリクスで、
    # ストア・スコア化は自前で持つ。
    "anomalib[cu130]>=2.6,<3",
    # torch 系は [tool.uv.sources] で pytorch-cu130 index から取得するため直接依存にする。
    "torch>=2.9",
    "torchvision>=0.24",
    "torchcodec>=0.9",

    # --- 特徴抽出バックボーン (ssl-vit-feature-extraction) ---
    "timm>=1.0.20",            # vit_*_patch16_dinov3 対応は timm 1.0.20 以降

    # --- 近傍探索 / 特徴量ストア (patch-feature-store) ---
    # faiss-gpu の公式 wheel は x86-64 のみ。DGX Spark は aarch64 のため faiss-cpu を使用。
    # (GPU 近傍探索が必要になった場合は sm_121 指定でソースビルド、または cuVS を検討)
    "faiss-cpu>=1.11",
    "numpy>=2.1,<3",
    "scikit-learn>=1.4",
    "scipy>=1.13",             # Mahalanobis 距離などの一次検出用

    # --- LLM 構造化 (llm-feedback-structuring) ---
    "pydantic>=2.7",           # 運用スキーマ定義 & JSON Schema 生成
    "jsonschema>=4.21",        # 構造化 JSON のスキーマ検証
]

[project.optional-dependencies]
# ローカル LLM (DGX Spark) 呼び出しクライアント。
# vLLM 本体は aarch64/Blackwell では NVIDIA 提供コンテナ (vllm/vllm-openai:cu130-*) で運用し、
# ここでは OpenAI 互換 API / Ollama を叩くクライアント側のみを入れる。
llm = [
    "openai>=1.40",            # vLLM の OpenAI 互換エンドポイント + guided_json 用
    "ollama>=0.4",             # Ollama structured outputs 用
    "transformers>=4.44",
]

# 開発 / 実験用
dev = [
    "anomalib[dev]",           # onnx/openvino/pytest 等の開発 extra
    "jupyterlab>=4",
    "ipykernel",
    "matplotlib>=3.8",
    "ruff>=0.6",
    "pytest>=8",
    "hypothesis>=6",
    "import-linter>=2",
]

[tool.uv]
# アプリケーション用途 (ライブラリとしてビルドしない)
package = false

# torch 系は PyPI ではなく PyTorch の CUDA 13 (cu130) index から取得する。
# cu130 は aarch64 wheel (cp312) を提供し、DGX Spark (GB10 / Blackwell sm_121) に対応。
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true            # tool.uv.sources で明示指定した package のみこの index を使う

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchcodec = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.importlinter]
root_packages = [
    "correction_layer",
    "feature_extraction",
    "patch_feature_store",
    "primary_anomaly_detection",
    "visa_gate",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "層の依存方向（外側から内側のみ）"
type = "layers"
layers = [
    "correction_layer.engine",
    "correction_layer.boundary | correction_layer.decision",
    "correction_layer.model",
]

[[tool.importlinter.contracts]]
name = "decision 内のモジュールは互いに独立（engine が合成）"
type = "independence"
modules = [
    "correction_layer.decision.primary",
    "correction_layer.decision.matching",
    "correction_layer.decision.axis_matching",
    "correction_layer.decision.resolution",
    "correction_layer.decision.correction",
]

[[tool.importlinter.contracts]]
name = "model 内は domain_set → records／ports → types の一方向"
type = "layers"
layers = [
    "correction_layer.model.domain_set",
    "correction_layer.model.records | correction_layer.model.ports",
    "correction_layer.model.types",
]

[[tool.importlinter.contracts]]
name = "boundary 内は domain_loader → schema／prototype_store の一方向"
type = "layers"
layers = [
    "correction_layer.boundary.domain_loader",
    "correction_layer.boundary.schema | correction_layer.boundary.prototype_store",
]

[[tool.importlinter.contracts]]
name = "feature_extraction の層の依存方向（外側から内側のみ）"
type = "layers"
layers = [
    "feature_extraction.engine",
    "feature_extraction.boundary | feature_extraction.geometry",
    "feature_extraction.model",
]

[[tool.importlinter.contracts]]
name = "torch / timm / anomalib は boundary の外で import しない"
type = "forbidden"
source_modules = [
    "feature_extraction.model",
    "feature_extraction.geometry",
    "feature_extraction.engine",
]
forbidden_modules = ["torch", "timm", "anomalib"]

[[tool.importlinter.contracts]]
name = "geometry 内のモジュールは互いに独立（engine が合成）"
type = "independence"
modules = [
    "feature_extraction.geometry.tiling",
    "feature_extraction.geometry.patch_positions",
]

[[tool.importlinter.contracts]]
name = "model 内は ports → features → config／types・layout の一方向"
type = "layers"
layers = [
    "feature_extraction.model.ports",
    "feature_extraction.model.features",
    "feature_extraction.model.config",
    "feature_extraction.model.types | feature_extraction.model.layout",
]

[[tool.importlinter.contracts]]
name = "boundary 内は timm_backbone／anomalib_source → backbone_identity の一方向"
type = "layers"
layers = [
    "feature_extraction.boundary.timm_backbone | feature_extraction.boundary.anomalib_source",
    "feature_extraction.boundary.backbone_identity",
]

[[tool.importlinter.contracts]]
name = "patch_feature_store の層の依存方向（外側から内側のみ）"
type = "layers"
layers = [
    "patch_feature_store.engine",
    "patch_feature_store.engine_snapshot",
    "patch_feature_store.boundary | patch_feature_store.catalog",
    "patch_feature_store.model",
]

[[tool.importlinter.contracts]]
name = "catalog 内のモジュールは互いに独立（engine が合成）"
type = "independence"
modules = [
    "patch_feature_store.catalog.registry",
    "patch_feature_store.catalog.journal",
    "patch_feature_store.catalog.admission",
    "patch_feature_store.catalog.merging",
    "patch_feature_store.catalog.pruning",
    "patch_feature_store.catalog.banks",
]

[[tool.importlinter.contracts]]
name = "model 内は ports → snapshot → prototype → registration／operations／bank → query → errors → criteria／config／types の一方向"
type = "layers"
layers = [
    "patch_feature_store.model.ports",
    "patch_feature_store.model.snapshot",
    "patch_feature_store.model.prototype",
    "patch_feature_store.model.registration | patch_feature_store.model.operations | patch_feature_store.model.bank",
    "patch_feature_store.model.query",
    "patch_feature_store.model.errors",
    "patch_feature_store.model.criteria | patch_feature_store.model.config | patch_feature_store.model.types",
]

[[tool.importlinter.contracts]]
name = "patch_feature_store の faiss / torch / anomalib は boundary の外で import しない"
type = "forbidden"
source_modules = [
    "patch_feature_store.model",
    "patch_feature_store.catalog",
    "patch_feature_store.engine",
    "patch_feature_store.engine_snapshot",
]
forbidden_modules = ["faiss", "torch", "anomalib"]

[[tool.importlinter.contracts]]
name = "boundary 内は snapshot_store／faiss_index／anomalib_coreset／clock → snapshot_schema の一方向"
type = "layers"
layers = [
    "patch_feature_store.boundary.snapshot_store | patch_feature_store.boundary.faiss_index | patch_feature_store.boundary.anomalib_coreset | patch_feature_store.boundary.clock",
    "patch_feature_store.boundary.snapshot_schema",
]

[[tool.importlinter.contracts]]
name = "correction_layer / feature_extraction は patch_feature_store を import しない"
type = "forbidden"
source_modules = [
    "correction_layer",
    "feature_extraction",
]
forbidden_modules = ["patch_feature_store"]

[[tool.importlinter.contracts]]
name = "patch_feature_store は correction_layer を import しない"
type = "forbidden"
source_modules = ["patch_feature_store"]
forbidden_modules = ["correction_layer"]

[[tool.importlinter.contracts]]
name = "primary_anomaly_detection の層の依存方向（外側から内側のみ）"
type = "layers"
layers = [
    "primary_anomaly_detection.engine",
    "primary_anomaly_detection.boundary | primary_anomaly_detection.scoring | primary_anomaly_detection.localization",
    "primary_anomaly_detection.model",
]

[[tool.importlinter.contracts]]
name = "model 内は ports／results → config → errors／types の一方向"
type = "layers"
layers = [
    "primary_anomaly_detection.model.ports | primary_anomaly_detection.model.results",
    "primary_anomaly_detection.model.config",
    "primary_anomaly_detection.model.errors | primary_anomaly_detection.model.types",
]

[[tool.importlinter.contracts]]
name = "scoring 内のモジュールは互いに独立（engine が合成）"
type = "independence"
modules = [
    "primary_anomaly_detection.scoring.knn",
    "primary_anomaly_detection.scoring.mahalanobis",
    "primary_anomaly_detection.scoring.fusion",
]

[[tool.importlinter.contracts]]
name = "localization 内のモジュールは互いに独立（engine が合成）"
type = "independence"
modules = [
    "primary_anomaly_detection.localization.heatmap",
    "primary_anomaly_detection.localization.roi",
]

[[tool.importlinter.contracts]]
name = "primary_anomaly_detection の torch / timm / anomalib / faiss は直接 import しない"
type = "forbidden"
source_modules = ["primary_anomaly_detection"]
forbidden_modules = ["torch", "timm", "anomalib", "faiss"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "primary_anomaly_detection の model / scoring / localization / engine は patch_feature_store を import しない"
type = "forbidden"
source_modules = [
    "primary_anomaly_detection.model",
    "primary_anomaly_detection.scoring",
    "primary_anomaly_detection.localization",
    "primary_anomaly_detection.engine",
]
forbidden_modules = ["patch_feature_store"]

[[tool.importlinter.contracts]]
name = "primary_anomaly_detection は visa_gate / evaluation_framework / correction_layer を import しない"
type = "forbidden"
source_modules = ["primary_anomaly_detection"]
forbidden_modules = ["visa_gate", "evaluation_framework", "correction_layer"]

[[tool.importlinter.contracts]]
name = "correction_layer / feature_extraction / patch_feature_store は primary_anomaly_detection / visa_gate を import しない"
type = "forbidden"
source_modules = [
    "correction_layer",
    "feature_extraction",
    "patch_feature_store",
]
forbidden_modules = ["primary_anomaly_detection", "visa_gate"]

[[tool.importlinter.contracts]]
name = "visa_gate の層の依存方向（外側から内側のみ）"
type = "layers"
layers = [
    "visa_gate.cli",
    "visa_gate.gate",
    "visa_gate.boundary",
    "visa_gate.model",
]

[[tool.importlinter.contracts]]
name = "visa_gate.boundary 内のモジュールは互いに独立（gate が合成）"
type = "independence"
modules = [
    "visa_gate.boundary.dataset_guard",
    "visa_gate.boundary.extraction_assembly",
    "visa_gate.boundary.store_assembly",
    "visa_gate.boundary.run_artifacts",
    "visa_gate.boundary.metrics_adapter",
]
